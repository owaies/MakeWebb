name: Mobile Visual Verification

on:
  push:
  pull_request:

jobs:
  mobile-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run build
      - run: npm install --no-save @playwright/test@1.55.0
      - run: npx playwright install chromium --with-deps
      - run: npx playwright test
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: makewebb-visual-evidence
          path: test-results/
          if-no-files-found: ignore
