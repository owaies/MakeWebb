name: Mobile Visual Verification

on:
  push:
  pull_request:

jobs:
  mobile-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - run: npx --yes playwright@1.55.0 install chromium --with-deps
      - run: npx --yes playwright@1.55.0 test
